  version: 1.0.0
  description: >-
    Derived at P3.1 from backend-execution-plan-inv.md (INV v1) — one operation per API-* block, one error
    response per Error Catalog row naming the block. Envelope ApiResponse<T>, lists Page<T>, errors
    LocalizedException {code, messageAr, messageEn}; code format {MOD}-{http}[-{SLUG}].
servers:
  - url: /
security:
  - bearerAuth: []
x-module: INV
x-generated-from: analysis/modules/INV/P3_1/backend-execution-plan-inv.md
x-inprocess-error-codes:
  - {code: INV-409-RESERVE-NOT-AVAILABLE, rule: RULE-INV-020, http: 409}
  - {code: INV-409-RESERVATION-CLOSED, rule: RULE-INV-021, http: 409}
  - {code: INV-409-STOCK-MOVE-IMMUTABLE, rule: RULE-INV-023, http: 409}
  - {code: INV-422-LOT-EXPIRED, rule: RULE-INV-039, http: 422}
x-common:
  errorContent: &ec {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}
  r400: &r400 {description: Bad request, x-error-codes: [INV-400], content: *ec}
  r401: &r401 {description: Unauthenticated, x-error-codes: [INV-401], content: *ec}
  r403: &r403 {description: Forbidden, x-error-codes: [INV-403], content: *ec}
  r500: &r500 {description: Server error, x-error-codes: [INV-500], content: *ec}
  pId: &pid {name: id, in: path, required: true, schema: {type: integer, format: int64}}
  pLineId: &plineid {name: lineId, in: path, required: true, schema: {type: integer, format: int64}}
  pVariantId: &pvariantid {name: variantId, in: path, required: true, schema: {type: integer, format: int64}}
  pItemId: &pitemid {name: itemId, in: path, required: true, schema: {type: integer, format: int64}}
  qPage: &qpage {name: page, in: query, required: false, schema: {type: integer, minimum: 0, default: 0}}
  qSize: &qsize {name: size, in: query, required: false, schema: {type: integer, minimum: 1, maximum: 100, default: 20}}

