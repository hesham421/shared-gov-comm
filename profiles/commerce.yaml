# ════════════════════════════════════════════════════════════════════════════
# profiles/commerce.yaml — the COMMERCE domain as DATA
# ----------------------------------------------------------------------------
# Retail & wholesale commerce SaaS on erp-core (the given): back-office, POS and
# an integrated storefront, one codebase for many trading activities through six
# capability flags and per-activity presets. Source of every domain fact:
# profiles/commerce/knowledge/raw-idea.md (the platform brief, 2026-10-21).
# Stack, conventions and plan vocabulary follow the rental-system profile — the
# same technologies on the same core; the domain vocabulary is the brief's.
# Validated by profiles/_schema.yaml.
# ════════════════════════════════════════════════════════════════════════════
schema_version: 6

identity:
  id: commerce
  display: COMMERCE
  description: >-
    Retail & wholesale commerce SaaS for small and medium traders in Egypt and the Gulf:
    back-office (purchasing, inventory, sales, receivables/payables, accounting, tax & e-invoicing),
    point of sale and an integrated e-commerce storefront — one catalogue, one stock, one customer
    base — built on the erp-core given, activity-aware through six capability flags.

languages:
  all: [ar, en]
  primary: en                       # the brief and every source document are English; the market is Arabic
  require_all: true                 # bilingual artifacts (the core's envelope carries messageAr/messageEn); English-only = incomplete

vocabulary:
  module_prefixes:                  # the brief's §5 module map — a fixed DAG, delivered in the §8 order;
                                    # a code named during a run but missing here flows through as RESERVED
    CAT: Catalog                    # 1 — item, variants, media, categories, publish state
    PRC: Pricing                    # 2 — price lists, promotions, coupons, loyalty points
    INV: Inventory                  # 3 — stock, reservations, transfers, counts, lot/expiry, dual quantity
    PTY: Party                      # 4 — customers (incl. CUSTOMER-realm users), suppliers, addresses, credit
    PUR: Purchasing                 # 5 — PO, goods receipt, supplier invoice
    SLS: Sales & POS                # 6 — quotation, order, invoice, returns/exchange; POS mode (offline-capable)
    STL: Settlements                # 7 — collections, payments, AR/AP ageing, payment gateway adapter
    TAX: Tax & E-invoicing          # 8 — VAT, country adapters (ETA / ZATCA / Oman), tax returns
    ACC: Accounting                 # 9 — auto-posting rules, GL, cost centres, budgets, period close
    SWR: Serial & Warranty          # 10 — serials, warranty cards, service returns (flag serialTracking)
    APR: Approvals                  # 11 — per-document approval steps (D6), no BPM engine
    SHP: Shipping                   # 12 — delivery status, carrier adapters
    SFR: Storefront                 # 13 — public catalogue/search, guest cart, checkout, customer area, tenant-by-host
    INS: Insights                   # 14 — dashboards, standard reports, saved filters
  keyword_map:                      # free-text keywords (any language) P0 uses to detect modules
    CAT: [catalog, catalogue, item, product, SKU, variant, category, barcode, bundle, kit, صنف, منتج, تصنيف, باركود]
    PRC: [price, price list, promotion, discount, coupon, loyalty, سعر, قائمة أسعار, عرض, خصم, كوبون, نقاط]
    INV: [inventory, stock, warehouse, transfer, stock count, reservation, lot, expiry, FEFO, dual quantity, مخزون, مستودع, مخزن, تحويل, جرد, تشغيلة, صلاحية]
    PTY: [customer, supplier, vendor, party, address, credit limit, payment terms, عميل, مورد, عنوان, حد ائتمان]
    PUR: [purchase, purchase order, PO, goods receipt, GRN, supplier invoice, شراء, أمر شراء, استلام, فاتورة مورد]
    SLS: [sale, sales, quotation, sales order, invoice, return, exchange, POS, point of sale, cashier, shift, بيع, عرض سعر, فاتورة, مرتجع, نقطة بيع, كاشير]
    STL: [collection, payment, receipt voucher, payment voucher, ageing, receivable, payable, AR, AP, payment gateway, تحصيل, سداد, سند قبض, سند صرف, ذمم]
    TAX: [VAT, tax, e-invoice, e-invoicing, e-receipt, ETA, ZATCA, tax return, ضريبة, فاتورة إلكترونية, إيصال إلكتروني, إقرار ضريبي]
    ACC: [accounting, journal, GL, ledger, posting, chart of accounts, cost centre, cost center, budget, period close, محاسبة, قيد, دفتر الأستاذ, مركز تكلفة, موازنة, إقفال]
    SWR: [serial, serial number, IMEI, warranty, warranty card, service return, رقم تسلسلي, ضمان, بطاقة ضمان, صيانة]
    APR: [approval, approve, reject, approval step, موافقة, اعتماد, رفض]
    SHP: [shipping, delivery, carrier, courier, shipment, tracking, شحن, توصيل, شركة شحن, تتبع]
    SFR: [storefront, online store, e-commerce, shop, cart, checkout, guest checkout, subdomain, custom domain, customer area, متجر إلكتروني, سلة, إتمام الشراء]
    INS: [dashboard, report, insight, KPI, saved filter, لوحة, تقرير, مؤشر]
  entity_kinds: [master, transactional, lookup, config, security]
  glossary:
    Module: A bounded functional area with its own registry, entities and screens, identified by a module code.
    Composite Screen: Search + Entry (or Master + Detail, Wizard) treated as ONE screen with ONE SCR-ID.
    XM: A cross-module dependency (HARD-FK or SOFT-READ) declared by the consuming module; dependencies flow downward only in the §5 DAG.
    LOV: List of values loaded at runtime from the lookup module — never hardcoded.
    Given: A library the platform builds on and never rebuilds (erp-core); reached only through its manifest's extension points, interfaces and APIs.
    Capability flag: One of six tenant-level switches (variants, serialTracking, lotExpiry, dualQuantity, bundles, b2bCredit) read through the single FeatureFlags API; the only thing business logic may vary on.
    Activity preset: A named trading activity (electronics, apparel, grocery, …) that sets the capability flags at setup; never read by business logic.
    Variant: A sellable member of an item distinguished by attributes (size, colour, …); catalogue, cart and stock are at variant level when the variants flag is on.
    Lot: A received quantity tracked under one lot number with an expiry date; issued FEFO when the lotExpiry flag is on.
    Dual quantity: A stock quantity carried in two units at once (count and weight/length), priced per either unit, when the dualQuantity flag is on.
    Bundle: A composite item, kit or promo pack sold as one line and relieved from stock as its components.
    Guest checkout: A storefront order placed without an account; the guest becomes a CUSTOMER-realm account after the first order.
    Storefront tenant: The tenant a public request resolves to by host — subdomain by default, custom domain optionally; the default tenant in single mode.
    Conformance scenario: One CI-run end-to-end scenario per activity preset (setup → receive → sell → return → collect → report) that defines "covers activity X".
    Progressive disclosure: Every screen starts minimal, at most four mandatory fields; "Advanced" reveals the rest; only enabled capabilities are shown.
  glossary_synonyms:
    Capability flag: [feature toggle, feature switch, activity flag, option flag]
    Activity preset: [business type, vertical, industry template, activity profile]
    Variant: [SKU option, sub-item, child item]
    Bundle: [composite product, kit item, package deal]
    Guest checkout: [anonymous checkout, checkout without login]
    Given: [core dependency, base library, platform core]

tracks:
  backend:
    plans:
      exec:
        phases:
          - {key: CORE,     display: CORE,      never_split: true, no_tests: true}
          - {key: DATA-DOM, display: DATA+DOM,  sub_labels: [MASTER, TRANSACTIONAL, LOOKUP], no_tests: true}
          - {key: SVC-API,  display: SVC+API,   split_threshold: {kind: API, count: 8, op: ">=", grouping: "CRUD / SEARCH / INT"}, sub_labels: [CRUD, SEARCH, INT]}
          - {key: DOC,      display: DOC,       never_split: true, no_tests: true}
          - {key: SEC-BE,   display: SEC-BE,    never_split: true, no_tests: true}
          - {key: ALIGN-BE, display: ALIGN-BE,  never_split: true, no_tests: true}
          - {key: INT-C,    display: INT-C,     integration: true}   # LAST: one block per XM edge, one package each (factory.yaml → integration)
      test:
        phases:
          - {key: TEST-PLAN-BE, split_threshold: {kind: TC, count: 12, op: ">", grouping: "RULE-SCENARIOS / API-SCENARIOS"}, sub_labels: [RULE-SCENARIOS, API-SCENARIOS]}
          - {key: INT-XM,       display: INT-XM,     integration: true, split_threshold: {kind: TC, count: 8, op: ">", grouping: "per target module"}}
  frontend:
    plans:
      exec:
        phases:
          # ONE SUB per screen, always, at any screen count (sub_bearing); see the rental-system profile for why
          - {key: F1, binds_api: true,       display: "F1 — Models & Types",     sub_bearing: true, no_tests: true}
          - {key: F2, binds_api: true,       display: "F2 — Data Hooks",         sub_bearing: true}
          - {key: F3, binds_api: true,       display: "F3 — Forms & Validators", sub_bearing: true}
          - {key: F4,                        display: "F4 — Screens & Routes",   sub_bearing: true}
          - {key: SEC-FE,   never_split: true, no_tests: true}
          - {key: ALIGN-FE, never_split: true, no_tests: true}
      test:
        phases:
          - {key: TEST-PLAN-FE, split_threshold: {kind: TC, count: 8, op: ">", grouping: "UI-FLOWS / INT-FLOW"}, sub_labels: [UI-FLOWS, INT-FLOW]}
          - {key: INT-UXD,      display: INT-UXD,    integration: true, split_threshold: {kind: TC, count: 8, op: ">", grouping: "per source module"}}

stack:
  db:
    dialects: [postgresql16]                 # PostgreSQL 16, Flyway, app migrations V1000+ (the core owns the lower range)
    target_dialect: postgresql16
    delete_semantics: soft                   # deactivate via the active flag; hard delete only where the SRS mandates it
    pk_generation: identity                  # greenfield: the dialect's identity clause (syntax_map.identity)
    required_marker: NOT NULL                # how the db-script marks a column required
    naming:
      flag_suffix: Fl                        # isActiveFl
      audit_fields: [createdBy, createdAt, updatedBy, updatedAt]
      pk_pattern: "{entity}Pk"
      sequence_pattern: "SEQ_{TABLE}"        # one sequence per table; {TABLE} = the physical table name
    syntax_map:
      identity:   {postgresql16: "GENERATED ALWAYS AS IDENTITY"}
      sequence:   {postgresql16: "CREATE SEQUENCE {name} START WITH 1 INCREMENT BY 1 CACHE 1 NO CYCLE;"}
      pk:         {postgresql16: "BIGINT"}
      string:     {postgresql16: "VARCHAR(n)"}
      boolean:    {postgresql16: "BOOLEAN"}
      timestamp:  {postgresql16: "TIMESTAMPTZ"}
      decimal:    {postgresql16: "NUMERIC(p,s)"}
      text:       {postgresql16: "TEXT"}
      json:       {postgresql16: "JSONB"}
  backend:
    framework: spring-boot-java              # Spring Boot on Java 25, on the erp-core given; Jasper printing via the core PrintApi
    api:
      base_path: "/api/v1/{module}/{resource}"   # the storefront's public surface is the core's /api/public/... (D4, app-config)
      verbs: {POST: create, GET: read, PUT: update, DELETE: deactivate (soft), PATCH: partial}
      envelope: "ApiResponse<T>"
      paging: "Page<T>"
      error_envelope: "LocalizedException → {code, messageAr, messageEn}"
      error_code_format: "{MOD}-{http}[-{SLUG}]"  # e.g. SLS-409-INVOICE-DUP, SLS-500 ; {SLUG} = SCREAMING-KEBAB, [ ] = optional half
      http_statuses: [200, 201, 400, 401, 403, 404, 409, 413, 415, 422, 500]
                                             # the statuses the core platform can emit — read off erp-core's own
                                             # "Status -> HTTP Status Reference" table (api-docs); correct THIS
                                             # list from that table when the core changes, never the rows checked against it
      paging_params: [page, size]
      auth: {type: http, scheme: bearer, bearer_format: JWT}   # the core's security module (sec); realms: staff and CUSTOMER
    layers: [controller, service, mapper, domain, repository]
  frontend:
    framework: react-ts-vite                 # ONE build for every deployment; reads GET /api/public/app-config (tenancy mode, flags, preset)
    libraries:
      routing: react-router
      server-state: tanstack-query
      forms: react-hook-form
      validation: zod
      state: zustand
    lazy_chunk_per: composite-screen
  mobile:
    framework: NONE                          # v1: responsive, mobile-first web for selling, collecting, counting; no native app (§9)
  testing:
    backend: agnostic                        # framework chosen by the consumer repo; the test stage emits framework-neutral TC specs
    frontend: agnostic

conventions:
  entity_defaults:
    master:        [nameAr, nameEn, code, isActiveFl, createdBy, createdAt, updatedBy, updatedAt]
    transactional: [docNo, docDate, statusCode, createdBy, createdAt, updatedBy, updatedAt]
    lookup:        [code, nameAr, nameEn, sortOrder, isActiveFl]
    config:        [key, valueAr, valueEn, isActiveFl]
  security_model:
    page_registry: SEC_PAGES
    permission_pattern: "PERM_<PAGE_CODE>_<ACTION>"
    actions: [VIEW, CREATE, UPDATE, DELETE]
    gateway_action: VIEW                     # without VIEW no other permission applies
    grant_target: role                       # three role presets (Owner, Seller/Cashier, Warehouse) + custom roles via core permissions (D8)
  composite_screen: true
  screen_composition: true                   # every screen block states where its secondary detail sits and how many times it saves
  identifiers: "every entity identifier is a BIGINT identity key the database assigns (stack.db.pk_generation = identity); a contract states identifier type BIGINT; a consumer's HARD-FK column is BIGINT; no other identifier type exists in v1"
  numbering: "document numbers come from the core sequence module; never generated in a business module"
  lookups: "all LOV values runtime-loaded from the core lookup module (mdl); no hardcoded enums in APIs or field specs; activity presets and capability flags are core settings, read through FeatureFlags"
  workflow_engine: forbidden                 # D6: Approvals is a lightweight business module, no BPM engine
  module_interface: in_process               # ONE deployable on erp-core: modules reach each other through published
                                             # in-process interfaces (the brief's crossmodule APIs), injected — never HTTP
  domain_behaviour_placement: domain_classes # consistent with stack.backend.layers, which declares `domain` as its own layer

plan_vocabulary:                             # the labels the plans use on the lines the checks read
  request_line: Request
  effect_line: Orchestration
  operations_line: OPERATIONS
  screen_operations_line: Operations
  screen_subjects_line: Entities
  operation_separators: [",", ";", "/", "·"]
  exclusion_reasons: [system-generated, derived, seeded, DEFERRED, core-provided]   # core-provided: the given does it

bootstrap_data:                              # the plan's `bootstrap` block carries the rows (kind · name · source)
  items:
    - {label: lookup key, declared_in: srs, block: lookups, field: key}
    - {label: permission, names: conventions.security_model.permission_pattern, declared_in: backend-execution-plan}

declared_totals:                             # stated once in the plan's `totals` block (analyze: count-agrees)
  - {artifact: backend-execution-plan, kind: DBF, rows_in: db-script}
  - {artifact: backend-execution-plan, kind: XM,  rows_in: db-script}
  - {artifact: backend-execution-plan, kind: API}
  - {artifact: backend-execution-plan, kind: QR}

self_check:                                  # the plans carry a `self-check` block the orchestrator stamps
  block: ALIGN

knowledge:
  files:
    - profiles/commerce/knowledge/raw-idea.md   # the platform brief — the raw idea the first stage reads

review:
  extra_checks:
    - {id: CM-1, stage: P1,   check: "every master entity carries the master entity_defaults", severity: MAJOR}
    - {id: CM-2, stage: P1,   check: "every screen maps to exactly one composite SCR and one SEC_PAGES row", severity: MAJOR}
    - {id: CM-3, stage: P2,   check: "every flag column ends with the flag_suffix", severity: MINOR}
    - {id: CM-4, stage: P3.1, check: "every mutation endpoint declares its PERM_* requirement", severity: MAJOR}
    - {id: CM-5, stage: P3.1, check: "every cross-module row states the access mechanism conventions.module_interface declares — no per-row choice, no HTTP client and no network error path where the platform is one deployable", severity: CRITICAL}
    - {id: CM-6, stage: P1,   check: "a requirement, rule or screen that varies by trading activity names a capability flag read through FeatureFlags — never an activity name or preset (D2)", severity: CRITICAL}
    - {id: CM-7, stage: P1,   check: "every required cell of the flag × activity matrix (brief §4.2) traces to an EARS requirement id; an untraced cell is a gap", severity: MAJOR}
    - {id: CM-8, stage: P2,   check: "every stock-bearing row carries warehouse_id, every monetary row carries its currency and every price its price list — the dimension exists from day one even while the tenant has one (brief §6.8)", severity: MAJOR}
    - {id: CM-9, stage: P1,   check: "a screen states at most four mandatory fields outside its Advanced section (brief §6.1)", severity: MINOR}
    - {id: CM-10, stage: P3.1, check: "a cross-module dependency points only DOWNWARD in the brief's §5 DAG (a lower-numbered module never depends on a higher one)", severity: CRITICAL}

# given:   # the given dependency — written by `gov.py given add erp-core --version <v> --from <checkout>`, never by hand first
